html, body { height: 100%; margin: 0; overflow: hidden; background: #04070e; color: #f3f6fc; }
body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
#nd-game { position: fixed; inset: 0; z-index: 0; background: #04070e; }
#nd-game canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

.nd-boot {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
  padding-inline: 16px;
  background:
    radial-gradient(120% 70% at 70% 110%, rgb(var(--nd-sodium-rgb) / 0.16), transparent 60%),
    radial-gradient(80% 60% at 0% 0%, rgb(var(--nd-deep2-rgb) / 0.9), transparent 70%),
    var(--nd-night);
  transition: opacity .6s ease;
}
.nd-boot.is-done { opacity: 0; pointer-events: none; }
.nd-boot__inner { width: min(440px, 100%); }
.nd-boot__kicker {
  font-family: var(--nd-font-display); font-style: italic; font-weight: 800;
  font-size: 20px; letter-spacing: .32em; text-transform: uppercase; color: var(--nd-sodium);
}
.nd-boot__title {
  font-family: var(--nd-font-display); font-style: italic; font-weight: 900;
  font-size: clamp(64px, 16vw, 112px); line-height: .82; text-transform: uppercase; color: var(--nd-head);
}
.nd-boot__track { position: relative; margin-top: 28px; height: 2px; background: rgb(var(--nd-steel-rgb) / .18); overflow: hidden; }
.nd-boot__bar {
  position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0);
  background: linear-gradient(90deg, rgb(var(--nd-sodium-rgb) / 0), var(--nd-sodium) 75%, var(--nd-head));
  transition: transform .5s ease;
}
.nd-boot__msg { margin-top: 12px; min-height: 1.4em; font-family: var(--nd-font-ui); font-size: 14px; color: var(--nd-steel); }
.nd-boot.is-error .nd-boot__msg { color: var(--nd-tail); }
.nd-boot.is-error .nd-boot__bar { background: var(--nd-tail); }
@media (prefers-reduced-motion: reduce) { .nd-boot, .nd-boot__bar { transition: none; } }

/* ==========================================================================
   НОЧНОЙ ДРИФТ — UI layer (menus, HUD, popups, minimap, touch controls)
   All selectors are namespaced with .nd-  — the only global rules are the
   :root tokens below. Inline this file into a <style> tag in the build.

   Identity: "long exposure" — the night harbor as a long-exposure photo.
   One motif: the light trail (bright head, fading tail). Colour = meaning:
     headlight white  neutral text
     sodium amber     active / selected / focus / drift heat
     ember            heat tier 3
     taillight red    danger, redline, burned chain
     starboard green  personal best only
   ========================================================================== */

:root {
  color-scheme: dark;

  /* --- palette (rgb triplets so alpha variants stay on-token) ---------- */
  --nd-night-rgb: 4 7 14;        /* scene sky / page base                 */
  --nd-deep-rgb: 10 18 33;       /* panels                                */
  --nd-deep2-rgb: 20 31 54;      /* raised, hover                         */
  --nd-steel-rgb: 139 151 179;   /* secondary text, hairlines             */
  --nd-dim-rgb: 84 96 124;       /* tertiary, empty pips                  */
  --nd-head-rgb: 243 246 252;    /* headlight white — primary text        */
  --nd-sodium-rgb: 255 165 58;   /* sodium lamp amber — accent            */
  --nd-hot-rgb: 255 208 138;     /* amber highlight                       */
  --nd-ember-rgb: 255 106 43;    /* heat tier 3                           */
  --nd-tail-rgb: 255 45 75;      /* taillight red — danger                */
  --nd-best-rgb: 63 227 160;     /* starboard green — personal best       */
  --nd-ink-rgb: 6 9 16;          /* text on amber                         */
  --nd-mask-rgb: 0 0 0;          /* mask alpha source (never visible)     */

  --nd-night: rgb(var(--nd-night-rgb));
  --nd-deep: rgb(var(--nd-deep-rgb));
  --nd-deep2: rgb(var(--nd-deep2-rgb));
  --nd-steel: rgb(var(--nd-steel-rgb));
  --nd-dim: rgb(var(--nd-dim-rgb));
  --nd-head: rgb(var(--nd-head-rgb));
  --nd-sodium: rgb(var(--nd-sodium-rgb));
  --nd-hot: rgb(var(--nd-hot-rgb));
  --nd-ember: rgb(var(--nd-ember-rgb));
  --nd-tail: rgb(var(--nd-tail-rgb));
  --nd-best: rgb(var(--nd-best-rgb));
  --nd-ink: rgb(var(--nd-ink-rgb));
  --nd-mask: rgb(var(--nd-mask-rgb));
  --nd-hair: rgb(var(--nd-steel-rgb) / 0.2);
  --nd-hair-strong: rgb(var(--nd-steel-rgb) / 0.38);

  /* --- type ----------------------------------------------------------- */
  --nd-font-display: 'Sofia Sans Extra Condensed', 'Roboto Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --nd-font-ui: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  /* --- stacking: the whole UI sits above the WebGL canvas -------------- */
  --nd-z: 10;

  background-color: var(--nd-night);
  color: var(--nd-head);
}

/* ==========================================================================
   Root container
   ========================================================================== */
.nd-ui {
  --s: 1;                       /* HUD scale, changed by breakpoints        */
  --edge: 24px;                 /* distance of HUD blocks from the edges    */
  --sa-t: env(safe-area-inset-top, 0px);
  --sa-r: env(safe-area-inset-right, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px);
  --ease-out: cubic-bezier(.16, .84, .3, 1);
  --heat: var(--nd-head);
  --heat-rgb: var(--nd-head-rgb);

  position: fixed;
  inset: 0;
  z-index: var(--nd-z);
  overflow: hidden;
  pointer-events: none;
  font-family: var(--nd-font-ui);
  font-size: 15px;
  line-height: 1.38;
  color: var(--nd-head);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}
.nd-ui *, .nd-ui *::before, .nd-ui *::after { box-sizing: border-box; }
:where(.nd-ui) :where(button, input, output) { font: inherit; color: inherit; }
:where(.nd-ui) :where(button) { -webkit-appearance: none; appearance: none; margin: 0; }
:where(.nd-ui) :where(h1, h2, h3, p, dl, dd, ul, ol) { margin: 0; padding: 0; }
:where(.nd-ui) :where(ul, ol) { list-style: none; }

:where(.nd-ui) :focus { outline: none; }
:where(.nd-ui) :focus-visible { outline: 2px solid var(--nd-sodium); outline-offset: 3px; }

.nd-vh {
  position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* display numerals: condensed italic, tabular */
.nd-num {
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 850;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  letter-spacing: 0.01em;
  padding-right: 0.06em;         /* italic overhang */
}

.nd-x {
  font-family: var(--nd-font-ui);
  font-style: normal;
  font-weight: 500;
  font-size: .64em;
  position: relative;
  top: -.14em;
  margin-right: .06em;
}

.nd-lbl {
  font-family: var(--nd-font-ui);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--nd-steel);
}

kbd.nd-key, .nd-key {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 25px;
  padding: 0 7px;
  font-family: var(--nd-font-ui);
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  color: var(--nd-head);
  background: rgb(var(--nd-deep2-rgb) / 0.95);
  border: 1px solid var(--nd-hair-strong);
  border-bottom-width: 3px;
  border-radius: 3px;
  white-space: nowrap;
}

/* generic layer visibility */
.nd-layer {
  position: absolute;
  inset: 0;
  visibility: hidden;
  opacity: 0;
  transition: opacity .22s ease, visibility 0s linear .22s;
}
.nd-layer.is-open {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  transition: opacity .22s ease, visibility 0s;
}

/* ==========================================================================
   Buttons & form controls (shared by menu, pause, sheets)
   ========================================================================== */
.nd-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 0 16px;
  font-size: 15px;
  font-weight: 500;
  text-align: left;
  color: var(--nd-head);
  background: rgb(var(--nd-deep-rgb) / 0.66);
  border: 1px solid var(--nd-hair);
  border-radius: 2px;
  cursor: pointer;
  transition: background-color .15s, border-color .15s, color .15s;
}
.nd-btn svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; }
.nd-btn:hover { background: rgb(var(--nd-deep2-rgb) / 0.92); border-color: var(--nd-hair-strong); }
.nd-btn:active { background: rgb(var(--nd-deep2-rgb) / 1); }
.nd-btn--primary {
  color: var(--nd-ink);
  font-weight: 650;
  background: var(--nd-sodium);
  border-color: var(--nd-sodium);
}
.nd-btn--primary:hover { background: var(--nd-hot); border-color: var(--nd-hot); }
.nd-btn--danger { color: var(--nd-head); background: rgb(var(--nd-tail-rgb) / 0.2); border-color: rgb(var(--nd-tail-rgb) / 0.75); }
.nd-btn--danger:hover { background: rgb(var(--nd-tail-rgb) / 0.32); border-color: var(--nd-tail); }
.nd-btn--ghost { background: transparent; border-color: transparent; color: var(--nd-steel); padding: 0 10px; }
.nd-btn--ghost:hover { background: rgb(var(--nd-deep2-rgb) / 0.7); color: var(--nd-head); border-color: transparent; }
.nd-btn .nd-key { margin-left: auto; }

.nd-iconbtn {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  color: var(--nd-steel);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 2px;
  cursor: pointer;
}
.nd-iconbtn:hover { color: var(--nd-head); background: rgb(var(--nd-deep2-rgb) / 0.8); }
.nd-iconbtn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; }

/* segmented control (radio group) */
.nd-seg {
  display: flex;
  background: rgb(var(--nd-deep-rgb) / 0.72);
  border: 1px solid var(--nd-hair);
  border-radius: 2px;
}
.nd-seg__opt {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  cursor: pointer;
}
.nd-seg__opt + .nd-seg__opt { border-left: 1px solid var(--nd-hair); }
.nd-seg__opt input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.nd-seg__opt span {
  display: block;
  padding: 10px 6px 11px;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--nd-steel);
  transition: color .15s, background-color .15s;
}
.nd-seg__opt:hover span { color: var(--nd-head); background: rgb(var(--nd-deep2-rgb) / 0.6); }
.nd-seg__opt input:checked + span {
  color: var(--nd-head);
  background: rgb(var(--nd-sodium-rgb) / 0.13);
  box-shadow: inset 0 -2px 0 var(--nd-sodium);
}
.nd-seg__opt input:focus-visible + span { outline: 2px solid var(--nd-sodium); outline-offset: -2px; }

/* track picker (main menu): two-line segmented options */
.nd-tracks { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }   /* (the strip never outgrows the column) */
.nd-tracks[hidden] { display: none; }
.nd-tracks__src { font-size: 10.5px; line-height: 1.35; color: var(--nd-steel); opacity: 0.7; }
.nd-tracks__src[hidden] { display: none; }
.nd-track span { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px 9px; }
.nd-track__name { font-weight: 600; font-size: 14px; color: inherit; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.nd-track__meta { font-size: 11.5px; font-weight: 500; color: var(--nd-steel); opacity: 0.85; overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: normal; line-height: 1.25; }

/* switch (checkbox role=switch) */
.nd-switch {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-height: 32px;
  cursor: pointer;
  font-size: 14.5px;
  color: var(--nd-head);
}
.nd-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.nd-switch__track {
  position: relative;
  flex: none;
  width: 44px;
  height: 24px;
  background: rgb(var(--nd-deep2-rgb) / 0.9);
  border: 1px solid var(--nd-hair-strong);
  border-radius: 2px;
  transition: background-color .18s, border-color .18s;
}
.nd-switch__track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 16px;
  height: 16px;
  background: var(--nd-steel);
  border-radius: 1px;
  transition: transform .2s var(--ease-out), background-color .18s;
}
.nd-switch input:checked + .nd-switch__track { background: rgb(var(--nd-sodium-rgb) / 0.18); border-color: var(--nd-sodium); }
.nd-switch input:checked + .nd-switch__track::after { transform: translateX(20px); background: var(--nd-sodium); }
.nd-switch input:focus-visible + .nd-switch__track { outline: 2px solid var(--nd-sodium); outline-offset: 3px; }

/* range */
.nd-range {
  --v: 50%;
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 28px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
.nd-range::-webkit-slider-runnable-track {
  height: 4px;
  background: linear-gradient(90deg, var(--nd-sodium) 0 var(--v), rgb(var(--nd-head-rgb) / 0.16) var(--v) 100%);
  border-radius: 0;
}
.nd-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  margin-top: -6px;
  background: var(--nd-head);
  border: 3px solid var(--nd-sodium);
  border-radius: 1px;
  transform: rotate(45deg);
}
.nd-range::-moz-range-track { height: 4px; background: rgb(var(--nd-head-rgb) / 0.16); border: 0; }
.nd-range::-moz-range-progress { height: 4px; background: var(--nd-sodium); }
.nd-range::-moz-range-thumb { width: 12px; height: 12px; background: var(--nd-head); border: 3px solid var(--nd-sodium); border-radius: 1px; transform: rotate(45deg); }
.nd-range:focus-visible { outline-offset: 2px; }

/* settings form */
.nd-settings { display: grid; gap: 16px; }
.nd-field { display: grid; gap: 7px; }
.nd-field__label {
  font-size: 13px;
  font-weight: 500;
  color: var(--nd-steel);
  margin-bottom: 7px;
}
.nd-field--range { grid-template-columns: 1fr auto; align-items: center; column-gap: 14px; }
.nd-field--range .nd-field__label { grid-column: 1 / -1; margin-bottom: 0; }
.nd-field--range output {
  min-width: 3.4em;
  text-align: right;
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 800;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
  color: var(--nd-head);
}

/* sheets / dialogs common heading */
.nd-h2 {
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 900;
  font-size: 34px;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  padding-right: .1em;
}

/* ==========================================================================
   MAIN MENU
   ========================================================================== */
.nd-menu { z-index: 50; display: flex; }
.nd-menu__scrim {
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(90deg, rgb(var(--nd-night-rgb) / 0.94) 0, rgb(var(--nd-night-rgb) / 0.8) 24%, rgb(var(--nd-night-rgb) / 0.32) 42%, rgb(var(--nd-night-rgb) / 0) 58%),
    linear-gradient(0deg, rgb(var(--nd-night-rgb) / 0.8) 0, rgb(var(--nd-night-rgb) / 0) 34%);
}
/* NB: neither the column nor its scroller is positioned, so the garage (absolute)
   resolves against .nd-menu and the title's light trail is not clipped. */
.nd-menu__col {
  flex: none;
  width: min(480px, 100%);
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: calc(34px + var(--sa-t)) 32px calc(30px + var(--sa-b)) calc(40px + var(--sa-l));
}
.nd-menu__scroll {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
  /* room for focus rings and the start button glow inside the scroller */
  margin: -8px -24px -8px -8px;
  padding: 8px 24px 8px 8px;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: rgb(var(--nd-steel-rgb) / 0.3) transparent;
}
.nd-menu__grow { flex: 1 1 0; min-height: 0; }

/* brand lockup with the light trail cutting through «ДРИФТ» */
.nd-brand { position: relative; flex: none; }
.nd-brand__title {
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 900;
  text-transform: uppercase;
  line-height: 0.8;
}
.nd-brand__a {
  display: block;
  font-size: clamp(22px, 4.6vh, 36px);
  font-weight: 800;
  letter-spacing: 0.21em;
  color: var(--nd-sodium);
  margin: 0 0 4px 3px;
}
.nd-brand__line { position: relative; display: block; }
.nd-brand__b {
  display: inline-block;
  font-size: clamp(84px, 17.5vh, 150px);
  letter-spacing: -0.01em;
  padding-right: 0.08em;
  color: var(--nd-head);
  /* the "slit" the light trail passes through */
  -webkit-mask-image: linear-gradient(180deg, var(--nd-mask) 0 57%, transparent 57% 62.5%, var(--nd-mask) 62.5% 100%);
  mask-image: linear-gradient(180deg, var(--nd-mask) 0 57%, transparent 57% 62.5%, var(--nd-mask) 62.5% 100%);
}
.nd-brand__trail {
  position: absolute;
  top: 59.75%;
  left: calc(-40px - var(--sa-l));
  width: 62vw;
  max-width: 1100px;
  height: 3px;
  margin-top: -1.5px;
  pointer-events: none;
  background: linear-gradient(90deg,
    rgb(var(--nd-tail-rgb) / 0) 0,
    rgb(var(--nd-tail-rgb) / 0.55) 22%,
    rgb(var(--nd-sodium-rgb) / 0.95) 62%,
    var(--nd-hot) 90%,
    var(--nd-head) 98.5%,
    rgb(var(--nd-head-rgb) / 0) 100%);
  box-shadow: 0 0 14px 1px rgb(var(--nd-sodium-rgb) / 0.55);
  transform-origin: 0 50%;
}
.nd-brand__trail::after {           /* the glowing head of the trail */
  content: "";
  position: absolute;
  right: 0;
  top: 50%;
  width: 90px;
  height: 22px;
  margin-top: -11px;
  background: radial-gradient(closest-side, rgb(var(--nd-head-rgb) / 0.9), rgb(var(--nd-sodium-rgb) / 0.35) 45%, rgb(var(--nd-sodium-rgb) / 0) 100%);
}
.nd-brand__meta {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 18px;
  font-size: 14px;
  color: var(--nd-steel);
}
.nd-brand__meta b { font-weight: 600; color: var(--nd-head); }

.nd-menu.is-open .nd-brand__trail { animation: nd-trail-in 1.25s var(--ease-out) both; }
.nd-menu.is-open .nd-brand__b, .nd-menu.is-open .nd-brand__a { animation: nd-fade-in .7s ease both; }
.nd-menu.is-open .nd-brand__a { animation-delay: .08s; }
@keyframes nd-trail-in {
  0% { transform: scaleX(0); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: scaleX(1); opacity: 1; }
}
@keyframes nd-fade-in { from { opacity: 0; } to { opacity: 1; } }

/* section label */
.nd-sec {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--nd-steel);
  margin-bottom: 8px;
}
.nd-sec output { font-weight: 500; color: var(--nd-head); text-align: right; }

/* --- mode cards ----------------------------------------------------- */
.nd-modes { flex: none; }
.nd-modes__list { display: grid; gap: 6px; }
.nd-mode {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto;
  column-gap: 14px;
  padding: 11px 16px 12px 18px;
  background: rgb(var(--nd-deep-rgb) / 0.4);
  border: 1px solid var(--nd-hair);
  border-radius: 2px;
  cursor: pointer;
  transition: background-color .18s, border-color .18s;
}
.nd-mode input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.nd-mode::before {                     /* LED strip on the leading edge */
  content: "";
  position: absolute;
  left: -1px;
  top: -1px;
  bottom: -1px;
  width: 3px;
  background: var(--nd-sodium);
  box-shadow: 0 0 14px rgb(var(--nd-sodium-rgb) / 0.8);
  transform: scaleY(0);
  transition: transform .22s var(--ease-out);
}
.nd-mode:hover { background: rgb(var(--nd-deep2-rgb) / 0.75); }
.nd-mode.is-sel { background: rgb(var(--nd-deep-rgb) / 0.92); border-color: var(--nd-hair-strong); }
.nd-mode.is-sel::before { transform: scaleY(1); }
.nd-mode__ring { position: absolute; inset: -5px; border: 2px solid var(--nd-sodium); border-radius: 3px; pointer-events: none; display: none; }
.nd-mode input:focus-visible ~ .nd-mode__ring { display: block; }

.nd-mode__head { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.nd-mode__name {
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 900;
  font-size: 27px;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.025em;
  color: var(--nd-head);
  padding-right: 0.08em;
}
.nd-mode__pips { display: inline-flex; gap: 3px; transform: translateY(-3px); }
.nd-pip { width: 13px; height: 5px; background: rgb(var(--nd-head-rgb) / 0.13); transform: skewX(-24deg); }
.nd-pip.is-on { background: rgb(var(--nd-head-rgb) / 0.8); }
.nd-mode.is-sel .nd-pip.is-on { background: var(--nd-sodium); }
.nd-mode__tag { grid-column: 1; margin-top: 4px; font-size: 13.5px; color: var(--nd-steel); }
.nd-mode.is-sel .nd-mode__tag { color: var(--nd-head); }
.nd-mode__mult {
  grid-column: 2;
  grid-row: 1 / span 2;
  align-self: center;
  text-align: right;
  line-height: 1;
}
.nd-mode__mult b {
  display: block;
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 900;
  font-size: 30px;
  color: var(--nd-steel);
  padding-right: .06em;
}
.nd-mode.is-sel .nd-mode__mult b { color: var(--nd-sodium); }
.nd-mode__mult small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--nd-steel); }

.nd-mode__more {
  grid-column: 1 / -1;
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .26s var(--ease-out);
}
.nd-mode.is-sel .nd-mode__more { grid-template-rows: 1fr; }
.nd-mode__more > span { display: block; overflow: hidden; min-height: 0; }
.nd-mode__desc, .nd-mode__rec { display: block; }
.nd-mode__desc { display: block; padding-top: 9px; font-size: 13.5px; line-height: 1.45; color: rgb(var(--nd-head-rgb) / 0.82); max-width: 44ch; }
.nd-mode__rec {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 16px;
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px solid var(--nd-hair);
  font-size: 12.5px;
  color: var(--nd-steel);
}
.nd-mode__rec b {
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 800;
  font-size: 19px;
  font-variant-numeric: tabular-nums;
  color: var(--nd-best);
  margin-left: 6px;
  padding-right: .06em;
}
.nd-mode__rec .is-none { color: var(--nd-steel); }

/* compact mode detail (row layout on phones) */
.nd-modeinfo { display: none; }

/* --- garage --------------------------------------------------------- */
.nd-garage {
  position: absolute;
  right: calc(40px + var(--sa-r));
  bottom: calc(30px + var(--sa-b));
  width: min(440px, calc(100vw - 560px));
  min-width: 320px;
  display: grid;
  gap: 12px;
  padding: 0;
}
.nd-garage__car {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
}
.nd-garage__car h2 {
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 900;
  font-size: 46px;
  line-height: .9;
  letter-spacing: 0.02em;
  color: var(--nd-head);
  padding-right: .08em;
}
.nd-garage__row { display: grid; gap: 0; }
.nd-garage__inline { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }

.nd-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.nd-chip {
  position: relative;
  width: 34px;
  height: 34px;
  cursor: pointer;
  flex: none;
}
.nd-chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.nd-chip__face {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: var(--c, var(--nd-steel));
  border-radius: 2px;
  box-shadow: inset 0 0 0 1px rgb(var(--nd-head-rgb) / 0.22);
  transition: transform .15s var(--ease-out);
}
.nd-chip__face::after {             /* gloss highlight — removed for matte */
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(140deg, rgb(var(--nd-head-rgb) / 0.55) 0, rgb(var(--nd-head-rgb) / 0.08) 38%, rgb(var(--nd-head-rgb) / 0) 52%, rgb(var(--nd-night-rgb) / 0.28) 100%);
}
.nd-chip--matte .nd-chip__face::after { background: linear-gradient(140deg, rgb(var(--nd-head-rgb) / 0.08), rgb(var(--nd-night-rgb) / 0.2)); }
.nd-chip--pearl .nd-chip__face::after { background: linear-gradient(140deg, rgb(var(--nd-head-rgb) / 0.75) 0, rgb(var(--nd-hot-rgb) / 0.25) 35%, rgb(var(--nd-best-rgb) / 0.12) 60%, rgb(var(--nd-night-rgb) / 0.2) 100%); }
.nd-chip::after {                   /* selected: LED underline */
  content: "";
  position: absolute;
  left: 2px;
  right: 2px;
  bottom: -7px;
  height: 3px;
  background: var(--nd-sodium);
  box-shadow: 0 0 10px rgb(var(--nd-sodium-rgb) / 0.8);
  transform: scaleX(0);
  transition: transform .2s var(--ease-out);
}
.nd-chip:hover .nd-chip__face { transform: translateY(-2px); }
.nd-chip.is-sel .nd-chip__face { box-shadow: inset 0 0 0 1px rgb(var(--nd-head-rgb) / 0.4), 0 0 0 2px var(--nd-night), 0 0 0 3px var(--nd-head); }
.nd-chip.is-sel::after { transform: scaleX(1); }
.nd-chip input:focus-visible ~ .nd-chip__face { outline: 2px solid var(--nd-sodium); outline-offset: 5px; }

.nd-chip--rim .nd-chip__face {
  border-radius: 50%;
  background:
    radial-gradient(circle, var(--nd-night) 0 17%, rgb(var(--nd-night-rgb) / 0) 18%),
    repeating-conic-gradient(from 8deg, var(--c) 0 22deg, rgb(var(--nd-night-rgb) / 0.82) 22deg 36deg);
  box-shadow: inset 0 0 0 4px rgb(var(--nd-night-rgb) / 0.95), inset 0 0 0 5px rgb(var(--nd-head-rgb) / 0.3);
}
.nd-chip--rim .nd-chip__face::after { border-radius: 50%; background: linear-gradient(140deg, rgb(var(--nd-head-rgb) / 0.35), rgb(var(--nd-head-rgb) / 0) 50%); }
.nd-chip--rim.is-sel .nd-chip__face { box-shadow: inset 0 0 0 4px rgb(var(--nd-night-rgb) / 0.95), inset 0 0 0 5px rgb(var(--nd-head-rgb) / 0.3), 0 0 0 2px var(--nd-night), 0 0 0 3px var(--nd-head); }

/* --- actions -------------------------------------------------------- */
.nd-actions {
  flex: none;
  position: sticky;
  bottom: 0;
  z-index: 2;
  display: grid;
  gap: 10px;
}
.nd-actions::before {                 /* content scrolling under the sticky button fades out */
  content: "";
  position: absolute;
  z-index: -1;
  left: -8px;
  right: -24px;
  top: -22px;
  bottom: -8px;
  background: linear-gradient(180deg, rgb(var(--nd-night-rgb) / 0), rgb(var(--nd-night-rgb) / 0.9) 22px);
  pointer-events: none;
}

/* help & settings live in a small toolbar, top-right */
.nd-menu__tools {
  position: absolute;
  top: calc(26px + var(--sa-t));
  right: calc(28px + var(--sa-r));
  display: flex;
  gap: 6px;
}
.nd-btn--tool { min-height: 40px; font-size: 14px; background: rgb(var(--nd-deep-rgb) / 0.5); }

.nd-start {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  height: 66px;
  padding: 0 34px 0 22px;
  border: 0;
  background: transparent;
  color: var(--nd-ink);
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 900;
  font-size: 36px;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.035em;
  cursor: pointer;
}
.nd-start::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(90deg, var(--nd-sodium) 0, var(--nd-sodium) 70%, var(--nd-hot) 100%);
  clip-path: polygon(0 0, 100% 0, calc(100% - 20px) 100%, 0 100%);
  transition: filter .15s;
}
.nd-start::after {                   /* trail head glow on the leading edge */
  content: "";
  position: absolute;
  z-index: -2;
  right: -16px;
  top: 50%;
  width: 120px;
  height: 90px;
  margin-top: -45px;
  background: radial-gradient(closest-side, rgb(var(--nd-sodium-rgb) / 0.5), rgb(var(--nd-sodium-rgb) / 0));
  opacity: .7;
  transition: opacity .2s;
}
.nd-start:hover::before { filter: brightness(1.08) saturate(1.05); }
.nd-start:hover::after { opacity: 1; }
.nd-start:active::before { filter: brightness(.95); }
.nd-start__label { padding-right: .08em; }
.nd-start__side { display: flex; align-items: center; gap: 10px; font-family: var(--nd-font-ui); font-style: normal; font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; }
.nd-start .nd-key { color: var(--nd-ink); background: rgb(var(--nd-ink-rgb) / 0.1); border-color: rgb(var(--nd-ink-rgb) / 0.35); }

/* ==========================================================================
   SHEETS (help, settings from main menu)
   ========================================================================== */
.nd-sheet { z-index: 70; display: grid; place-items: center; padding: calc(24px + var(--sa-t)) 24px calc(24px + var(--sa-b)); }
.nd-sheet__backdrop { position: absolute; inset: 0; background: rgb(var(--nd-night-rgb) / 0.72); }
.nd-sheet__panel {
  position: relative;
  display: flex;
  flex-direction: column;
  width: min(820px, 100%);
  max-height: 100%;
  background: rgb(var(--nd-deep-rgb) / 0.97);
  border: 1px solid var(--nd-hair-strong);
  border-top: 2px solid var(--nd-sodium);
  border-radius: 2px;
  box-shadow: 0 30px 80px rgb(var(--nd-night-rgb) / 0.7);
  transform: translateY(10px);
  transition: transform .26s var(--ease-out);
}
.nd-sheet.is-open .nd-sheet__panel { transform: none; }
.nd-sheet--narrow .nd-sheet__panel { width: min(480px, 100%); }
.nd-sheet__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 16px 14px 24px; }
.nd-sheet__head .nd-h2 { min-width: 0; }
.nd-sheet__head .nd-iconbtn { flex: none; }
.nd-sheet__body { padding: 4px 24px 24px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgb(var(--nd-steel-rgb) / 0.3) transparent; }

.nd-tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--nd-hair); overflow-x: auto; scrollbar-width: none; flex: none; }
.nd-tab {
  position: relative;
  padding: 10px 12px 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--nd-steel);
  background: transparent;
  border: 0;
  cursor: pointer;
  white-space: nowrap;
}
.nd-tab:hover { color: var(--nd-head); }
.nd-tab:focus-visible { outline-offset: -3px; }
.nd-tab[aria-selected="true"] { color: var(--nd-head); }
.nd-tab[aria-selected="true"]::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: -1px;
  height: 2px;
  background: var(--nd-sodium);
  box-shadow: 0 0 10px rgb(var(--nd-sodium-rgb) / 0.8);
}
.nd-tabpanel { padding-top: 20px; }
.nd-tabpanel[hidden] { display: none; }

.nd-keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 36px; }
.nd-keys li { display: grid; grid-template-columns: minmax(150px, auto) 1fr; align-items: center; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--nd-hair); font-size: 14.5px; }
.nd-keys__k { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; color: var(--nd-steel); font-size: 12.5px; }
.nd-keys__note { color: var(--nd-steel); font-size: 13px; }
.nd-keys__or { font-size: 12px; color: var(--nd-steel); padding: 0 2px; }

.nd-rules { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; }
.nd-rules p { font-size: 14.5px; line-height: 1.55; color: rgb(var(--nd-head-rgb) / 0.88); max-width: 60ch; }
.nd-rules p + p { margin-top: 12px; }
.nd-rules strong { font-weight: 600; color: var(--nd-head); }
.nd-rules__mult { font-family: var(--nd-font-display); font-style: italic; font-weight: 850; font-size: 1.2em; color: var(--nd-sodium); }
.nd-bonus { display: grid; gap: 0; }
.nd-bonus li { display: grid; gap: 1px; padding: 9px 0; border-bottom: 1px solid var(--nd-hair); }
.nd-bonus b {
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 900;
  font-size: 19px;
  letter-spacing: 0.03em;
  color: var(--nd-sodium);
}
.nd-bonus span { font-size: 13.5px; color: var(--nd-steel); }
.nd-bonus li.is-bad b { color: var(--nd-tail); }
.nd-rules .nd-bonus b { text-transform: uppercase; letter-spacing: .04em; }

/* ==========================================================================
   PAUSE
   ========================================================================== */
.nd-pause { z-index: 60; }
.nd-pause__scrim {
  position: absolute;
  inset: 0;
  /* no backdrop-filter: blurring a live WebGL canvas costs a full-screen pass per frame on phones */
  background:
    linear-gradient(90deg, rgb(var(--nd-night-rgb) / 0.95) 0, rgb(var(--nd-night-rgb) / 0.86) 45%, rgb(var(--nd-night-rgb) / 0.7) 100%);
}
.nd-pause__wrap {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: minmax(300px, 400px) minmax(320px, 460px);
  justify-content: start;
  align-content: center;
  gap: 32px 72px;
  padding: calc(36px + var(--sa-t)) calc(40px + var(--sa-r)) calc(36px + var(--sa-b)) calc(48px + var(--sa-l));
  overflow-y: auto;
  scrollbar-width: thin;
}
.nd-pause__main { display: grid; align-content: start; gap: 22px; }
.nd-pause__title {
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 900;
  font-size: 96px;
  line-height: .8;
  text-transform: uppercase;
  color: var(--nd-head);
  padding-right: .08em;
}
.nd-pause__run { display: flex; flex-wrap: wrap; gap: 8px 26px; }
.nd-stat { display: grid; gap: 1px; }
.nd-stat dt { font-size: 12.5px; color: var(--nd-steel); }
.nd-stat dd { font-family: var(--nd-font-display); font-style: italic; font-weight: 850; font-size: 24px; line-height: 1.05; font-variant-numeric: tabular-nums; padding-right: .06em; }
.nd-pause__btns { display: grid; gap: 8px; }
.nd-pause__btns[hidden] { display: none; }
.nd-pause__btns .nd-btn { width: 100%; min-height: 50px; font-size: 16px; }
.nd-pause__btns .nd-btn--primary { font-size: 17px; }
.nd-pause__side { display: grid; align-content: start; gap: 14px; padding-top: 6px; }
.nd-pause__side h3 { font-size: 13px; font-weight: 500; color: var(--nd-steel); }

.nd-confirm {
  display: grid;
  gap: 12px;
  padding: 16px 16px 16px 18px;
  background: rgb(var(--nd-tail-rgb) / 0.08);
  border: 1px solid rgb(var(--nd-tail-rgb) / 0.5);
  border-left: 3px solid var(--nd-tail);
}
.nd-confirm[hidden] { display: none; }
.nd-confirm p { font-size: 15px; line-height: 1.45; }
.nd-confirm p b { font-weight: 600; }
.nd-confirm__btns { display: flex; gap: 8px; flex-wrap: wrap; }
.nd-confirm__btns .nd-btn { flex: 1 1 auto; justify-content: center; }

/* ==========================================================================
   HUD
   ========================================================================== */
.nd-hud { position: absolute; inset: 0; z-index: 10; visibility: hidden; opacity: 0; transition: opacity .3s ease, visibility 0s linear .3s; }
.nd-ui.hud-on .nd-hud { visibility: visible; opacity: 1; transition: opacity .3s ease, visibility 0s; }
.nd-ui.is-menu .nd-hud { visibility: hidden; opacity: 0; }
.nd-hud::before, .nd-hud::after {   /* static legibility scrims */
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  pointer-events: none;
}
.nd-hud::before { top: 0; height: calc(150px * var(--s)); background: linear-gradient(180deg, rgb(var(--nd-night-rgb) / 0.5), rgb(var(--nd-night-rgb) / 0)); }
.nd-hud::after { bottom: 0; height: calc(150px * var(--s)); background: linear-gradient(0deg, rgb(var(--nd-night-rgb) / 0.42), rgb(var(--nd-night-rgb) / 0)); }

/* hard 1px shadows only: blurred shadows on text that changes every frame force costly re-rasters */
.nd-hud .nd-num, .nd-hud .nd-lbl, .nd-hud .nd-row dd { text-shadow: 0 1px 0 rgb(var(--nd-night-rgb) / 0.7); }
/* each widget gets its own compositor layer so per-frame text changes re-raster only that widget */
.nd-lap, .nd-score, .nd-tach, .nd-map { will-change: transform; }

/* --- lap (top-left) -------------------------------------------------- */
.nd-lap {
  position: absolute;
  z-index: 1;
  top: calc(var(--edge) * .8 + var(--sa-t));
  left: calc(var(--edge) + var(--sa-l));
  contain: layout style;
}
.nd-lap__head { display: flex; align-items: baseline; gap: 6px; }
.nd-lap__n { font-size: calc(26px * var(--s)); line-height: 1; color: var(--nd-head); }
.nd-lap__time { display: block; font-size: calc(48px * var(--s)); line-height: .95; color: var(--nd-head); margin-top: 2px; min-width: 4.3em; }
.nd-rows { display: grid; gap: calc(1px * var(--s)); margin-top: calc(6px * var(--s)); }
.nd-row { display: flex; align-items: baseline; gap: 10px; }
.nd-row dt { font-size: max(10.5px, calc(12.5px * var(--s))); min-width: 5.4em; color: var(--nd-steel); }
.nd-row dd { font-family: var(--nd-font-display); font-style: italic; font-weight: 800; font-size: max(15px, calc(21px * var(--s))); line-height: 1.1; font-variant-numeric: tabular-nums; padding-right: .06em; }
.nd-row--best dd { color: var(--nd-best); }
.nd-row--best dd.is-none { color: var(--nd-steel); }
.nd-row dd.is-flash { animation: nd-best-flash 1.6s ease-out; }
@keyframes nd-best-flash {
  0%, 30% { color: var(--nd-head); text-shadow: 0 0 14px rgb(var(--nd-best-rgb) / 1); }
  100% { text-shadow: 0 1px 2px rgb(var(--nd-night-rgb) / 0.85); }
}

/* --- score (top-right) ----------------------------------------------- */
.nd-score {
  position: absolute;
  z-index: 1;
  top: calc(var(--edge) * .8 + var(--sa-t));
  right: calc(var(--edge) + var(--sa-r));
  text-align: right;
  contain: layout style;
}
.nd-score__head { display: flex; align-items: baseline; justify-content: flex-end; gap: 10px; }
.nd-modetag {
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 850;
  font-size: max(12px, calc(16px * var(--s)));
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--nd-steel);
  padding-right: .06em;
}
.nd-score__total { display: block; font-size: calc(48px * var(--s)); line-height: .95; margin-top: 2px; color: var(--nd-head); transition: color .5s; }
.nd-score__total.is-bump-a { animation: nd-bump-a .8s var(--ease-out); }
.nd-score__total.is-bump-b { animation: nd-bump-b .8s var(--ease-out); }
@keyframes nd-bump-a {
  0% { color: var(--nd-hot); text-shadow: 0 0 18px rgb(var(--nd-sodium-rgb) / 0.9); }
  100% { color: var(--nd-head); }
}
@keyframes nd-bump-b {
  0% { color: var(--nd-hot); text-shadow: 0 0 18px rgb(var(--nd-sodium-rgb) / 0.9); }
  100% { color: var(--nd-head); }
}
.nd-score .nd-rows { justify-items: end; }
.nd-score .nd-row { justify-content: flex-end; }
.nd-score .nd-row dt { min-width: 0; }

/* --- drift chain (top-center) — the hero ------------------------------ */
.nd-chain {
  position: absolute;
  z-index: 2;
  top: calc(var(--edge) * .45 + var(--sa-t));
  left: 50%;
  width: calc(400px * var(--s));
  margin-left: calc(-200px * var(--s));
  display: grid;
  justify-items: center;
  contain: layout style;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity .25s ease, transform .3s var(--ease-out);
}
.nd-chain::before {                 /* soft dark pool behind the numbers */
  content: "";
  position: absolute;
  inset: -10% -6% -20%;
  z-index: -1;
  background: radial-gradient(50% 50% at 50% 48%, rgb(var(--nd-night-rgb) / 0.55), rgb(var(--nd-night-rgb) / 0));
  pointer-events: none;
}
.nd-chain[data-state="active"], .nd-chain[data-state="ending"], .nd-chain[data-state="banked"], .nd-chain[data-state="lost"] { opacity: 1; transform: none; }
.nd-chain[data-heat="1"] { --heat: var(--nd-head); --heat-rgb: var(--nd-head-rgb); }
.nd-chain[data-heat="2"] { --heat: var(--nd-sodium); --heat-rgb: var(--nd-sodium-rgb); }
.nd-chain[data-heat="3"] { --heat: var(--nd-ember); --heat-rgb: var(--nd-ember-rgb); }
.nd-chain[data-heat="4"] { --heat: var(--nd-tail); --heat-rgb: var(--nd-tail-rgb); }

.nd-fan { position: relative; width: calc(128px * var(--s)); height: calc(66px * var(--s)); }
.nd-fan svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.nd-fan__base { fill: none; stroke: rgb(var(--nd-head-rgb) / 0.2); stroke-width: 2; }
.nd-fan__tick { stroke: rgb(var(--nd-head-rgb) / 0.42); stroke-width: 1.5; }
.nd-fan__tick--major { stroke: rgb(var(--nd-head-rgb) / 0.75); stroke-width: 2; }
.nd-fan__lit { fill: none; stroke: var(--heat); stroke-width: 5; stroke-linecap: butt; }
.nd-fan__glow { fill: none; stroke: rgb(var(--heat-rgb) / 0.28); stroke-width: 11; stroke-linecap: butt; }
.nd-fan__needle {                    /* a bright tick that rides the arc */
  position: absolute;
  left: 50%;
  bottom: calc(4px * var(--s));
  width: 4px;
  margin-left: -2px;
  height: calc(58px * var(--s));
  transform-origin: 50% 100%;
  will-change: transform;
  background: linear-gradient(0deg, rgb(var(--nd-head-rgb) / 0) 0 70%, var(--nd-head) 70% 100%);
  border-radius: 1px;
}
.nd-fan__deg {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(1px * var(--s));
  text-align: center;
  font-size: calc(23px * var(--s));
  line-height: 1;
  color: var(--nd-head);
}
.nd-chain__main { display: flex; align-items: center; gap: calc(12px * var(--s)); margin-top: calc(1px * var(--s)); }
.nd-chain__pts { font-size: calc(62px * var(--s)); line-height: .92; color: var(--nd-head); white-space: nowrap; }
.nd-chain__mult { display: grid; justify-items: start; gap: calc(4px * var(--s)); }
.nd-chain__mult b {
  display: block;
  padding: calc(3px * var(--s)) calc(10px * var(--s)) calc(3px * var(--s)) calc(8px * var(--s));
  font-size: calc(32px * var(--s));
  line-height: 1;
  color: var(--nd-ink);
  background: var(--heat);
  clip-path: polygon(calc(6px * var(--s)) 0, 100% 0, calc(100% - calc(6px * var(--s))) 100%, 0 100%);
  text-shadow: none;
  transition: background-color .3s;
}
.nd-chain__mult b.is-up-a { animation: nd-pop-a .35s var(--ease-out); }
.nd-chain__mult b.is-up-b { animation: nd-pop-b .35s var(--ease-out); }
@keyframes nd-pop-a { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }
@keyframes nd-pop-b { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }
.nd-steps { display: flex; gap: 2px; }
.nd-steps i { width: calc(5px * var(--s)); height: calc(4px * var(--s)); background: rgb(var(--nd-head-rgb) / 0.22); transform: skewX(-20deg); }
.nd-steps i.is-on { background: var(--heat); }

.nd-chain__link {
  position: relative;
  width: 100%;
  height: 3px;
  margin-top: calc(9px * var(--s));
}
.nd-chain__link::after {               /* static halo, cheaper than an animated box-shadow */
  content: "";
  position: absolute;
  left: 15%;
  right: 15%;
  top: -5px;
  bottom: -5px;
  background: radial-gradient(50% 50% at 50% 50%, rgb(var(--heat-rgb) / 0.35), rgb(var(--heat-rgb) / 0));
  opacity: 1;
  transition: opacity .3s;
}
.nd-chain.is-draining .nd-chain__link::after { opacity: 0; }
.nd-chain__link::before { content: ""; position: absolute; inset: 0; background: rgb(var(--nd-head-rgb) / 0.12); }
.nd-chain__link i {
  position: absolute;
  inset: 0;
  transform-origin: 50% 50%;
  will-change: transform;
  background: linear-gradient(90deg, rgb(var(--heat-rgb) / 0) 0, var(--heat) 22%, var(--nd-head) 50%, var(--heat) 78%, rgb(var(--heat-rgb) / 0) 100%);
}
.nd-chain.is-draining .nd-chain__link i { background: linear-gradient(90deg, rgb(var(--nd-head-rgb) / 0) 0, var(--nd-head) 25%, var(--nd-head) 75%, rgb(var(--nd-head-rgb) / 0) 100%); }
.nd-chain.is-urgent .nd-chain__link i { animation: nd-blink .28s steps(2, jump-none) infinite; }
@keyframes nd-blink { 0% { opacity: 1; } 100% { opacity: .25; } }

/* end of chain: banked → points lift and fade; lost → red, struck through */
.nd-chain[data-state="ending"] { opacity: 0; transition: opacity .6s ease .25s, transform .3s; }
.nd-chain[data-state="banked"] .nd-chain__pts { animation: nd-bank 0.9s var(--ease-out) both; }
.nd-chain[data-state="banked"] .nd-fan, .nd-chain[data-state="banked"] .nd-chain__link, .nd-chain[data-state="banked"] .nd-chain__mult { opacity: 0; transition: opacity .3s; }
@keyframes nd-bank {
  0% { transform: none; opacity: 1; color: var(--nd-head); }
  25% { transform: scale(1.12); color: var(--nd-hot); opacity: 1; }
  100% { transform: translateY(-14px) scale(.9); opacity: 0; color: var(--nd-hot); }
}
.nd-chain[data-state="lost"] { --heat: var(--nd-tail); --heat-rgb: var(--nd-tail-rgb); }
.nd-chain[data-state="lost"] .nd-chain__pts { color: var(--nd-tail); animation: nd-lost 0.9s ease both; }
.nd-chain[data-state="lost"] .nd-chain__main { position: relative; }
.nd-chain[data-state="lost"] .nd-chain__main::after {
  content: "";
  position: absolute;
  left: -6%;
  right: -6%;
  top: 52%;
  height: calc(5px * var(--s));
  background: var(--nd-tail);
  box-shadow: 0 0 12px rgb(var(--nd-tail-rgb) / 0.9);
  transform-origin: 0 50%;
  animation: nd-strike .28s var(--ease-out) both;
}
.nd-chain[data-state="lost"] .nd-fan, .nd-chain[data-state="lost"] .nd-chain__link { opacity: .25; }
@keyframes nd-strike { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes nd-lost {
  0% { transform: translateX(0); opacity: 1; }
  10% { transform: translateX(-6px); }
  20% { transform: translateX(5px); }
  30% { transform: translateX(-3px); }
  40% { transform: translateX(0); opacity: 1; }
  100% { opacity: 0; }
}

/* --- popups (stack under the chain) ---------------------------------- */
.nd-pops {
  position: absolute;
  z-index: 2;
  left: 50%;
  top: calc(var(--edge) * .45 + var(--sa-t) + 158px * var(--s));
  width: 0;
  height: 0;
}
.nd-pop {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: baseline;
  gap: calc(8px * var(--s));
  white-space: nowrap;
  transform: translate(-50%, 0);
  transition: transform .28s var(--ease-out), opacity .28s ease;
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1;
  text-shadow: 0 1px 3px rgb(var(--nd-night-rgb) / 0.9);
  will-change: transform, opacity;
}
.nd-pop__txt { font-size: max(16px, calc(22px * var(--s))); padding-right: .08em; }
.nd-pop__val { font-size: max(16px, calc(22px * var(--s))); font-variant-numeric: tabular-nums; padding-right: .06em; }
.nd-pop--bonus .nd-pop__val { color: var(--nd-sodium); }
.nd-pop--bonus .nd-pop__txt { color: var(--nd-head); }
.nd-pop--info .nd-pop__txt { color: var(--nd-head); }
.nd-pop--info .nd-pop__val { color: var(--nd-best); }
.nd-pop--bank .nd-pop__txt { font-size: calc(24px * var(--s)); color: var(--nd-hot); }
.nd-pop--bank .nd-pop__val { font-size: calc(34px * var(--s)); color: var(--nd-head); }
.nd-pop--lost .nd-pop__txt { font-size: calc(30px * var(--s)); color: var(--nd-tail); letter-spacing: .06em; }
.nd-pop.is-in { animation: nd-pop-in .32s var(--ease-out) both; }
.nd-pop--lost.is-in { animation: nd-pop-lost .5s ease both; }
.nd-pop.is-out { opacity: 0; transition: transform .28s var(--ease-out), opacity .35s ease; }
@keyframes nd-pop-in {
  0% { opacity: 0; filter: blur(3px); letter-spacing: .3em; }
  100% { opacity: 1; filter: blur(0); letter-spacing: .04em; }
}
@keyframes nd-pop-lost {
  0% { opacity: 0; }
  15% { opacity: 1; }
  25% { opacity: .35; }
  35%, 100% { opacity: 1; }
}

/* fly-to-total number for banked chains */
.nd-fly {
  position: absolute;
  z-index: 3;
  left: 0;
  top: 0;
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 900;
  font-size: calc(26px * var(--s));
  color: var(--nd-hot);
  text-shadow: 0 0 12px rgb(var(--nd-sodium-rgb) / 0.8);
  pointer-events: none;
  will-change: transform, opacity;
}

/* --- minimap (bottom-left) ------------------------------------------- */
.nd-map {
  position: absolute;
  z-index: 1;
  left: calc(var(--edge) + var(--sa-l) - 8px);
  bottom: calc(var(--edge) + var(--sa-b) - 8px);
  width: calc(236px * var(--s));
  height: calc(160px * var(--s));
}
.nd-map::before {
  content: "";
  position: absolute;
  inset: -12%;
  background: radial-gradient(closest-side, rgb(var(--nd-night-rgb) / 0.62), rgb(var(--nd-night-rgb) / 0));
}
.nd-map canvas { position: relative; display: block; width: 100%; height: 100%; }

/* --- tach (bottom-right) --------------------------------------------- */
.nd-tach {
  position: absolute;
  z-index: 1;
  right: calc(var(--edge) + var(--sa-r) - 6px);
  bottom: calc(var(--edge) * .7 + var(--sa-b));
  width: calc(216px * var(--s));
  contain: layout style;
}
.nd-lights { display: flex; justify-content: center; gap: calc(4px * var(--s)); margin-bottom: calc(6px * var(--s)); }
.nd-lights i {
  width: calc(14px * var(--s));
  height: calc(6px * var(--s));
  background: rgb(var(--nd-head-rgb) / 0.14);
  transform: skewX(-20deg);
}
.nd-lights i.is-on { background: var(--nd-sodium); box-shadow: 0 0 8px rgb(var(--nd-sodium-rgb) / 0.9); }
.nd-lights i.is-on.is-hot { background: var(--nd-ember); box-shadow: 0 0 8px rgb(var(--nd-ember-rgb) / 0.9); }
.nd-lights i.is-on.is-red { background: var(--nd-tail); box-shadow: 0 0 10px rgb(var(--nd-tail-rgb) / 1); }
.nd-tach.is-limit .nd-lights i { animation: nd-limit .12s steps(2, jump-none) infinite alternate; }
@keyframes nd-limit { from { opacity: 1; } to { opacity: .2; } }

.nd-dial { position: relative; width: 100%; aspect-ratio: 1; }
.nd-dial::before {
  content: "";
  position: absolute;
  inset: 4%;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgb(var(--nd-night-rgb) / 0.72) 0 74%, rgb(var(--nd-night-rgb) / 0.3) 90%, rgb(var(--nd-night-rgb) / 0) 100%);
}
.nd-dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.nd-dial__track { fill: none; stroke: rgb(var(--nd-head-rgb) / 0.16); stroke-width: 2; }
.nd-dial__sweep { fill: none; stroke: var(--nd-sodium); stroke-width: 3.5; }
.nd-dial__glow { fill: none; stroke: rgb(var(--nd-sodium-rgb) / 0.25); stroke-width: 9; }
.nd-tach.is-red .nd-dial__glow { stroke: rgb(var(--nd-tail-rgb) / 0.3); }
.nd-tach.is-red .nd-dial__sweep { stroke: var(--nd-tail); }
.nd-dial__red { fill: none; stroke: var(--nd-tail); stroke-width: 5; }
.nd-dial__tick { stroke: rgb(var(--nd-head-rgb) / 0.45); stroke-width: 1.5; }
.nd-dial__tick--major { stroke: var(--nd-head); stroke-width: 2.5; }
.nd-dial__tick--red { stroke: var(--nd-tail); }
.nd-dial__num { fill: rgb(var(--nd-head-rgb) / 0.8); font-family: var(--nd-font-display); font-style: italic; font-weight: 800; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
.nd-dial__num--red { fill: var(--nd-tail); }
.nd-dial__needle {
  position: absolute;
  left: 50%;
  bottom: 50%;
  width: 4px;
  margin-left: -2px;
  height: 44%;
  transform-origin: 50% 100%;
  transform: rotate(-135deg);
  will-change: transform;
  background: linear-gradient(0deg, rgb(var(--nd-head-rgb) / 0) 0 56%, var(--nd-head) 56% 88%, var(--nd-sodium) 88% 100%);
  border-radius: 2px;
}
.nd-dial__speed {
  position: absolute;
  left: 0;
  right: 0;
  top: 33%;
  display: grid;
  justify-items: center;
  line-height: 1;
}
.nd-dial__speed b { font-size: calc(54px * var(--s)); color: var(--nd-head); }
.nd-dial__speed span { margin-top: 1px; font-size: max(10px, calc(12px * var(--s))); color: var(--nd-steel); }
.nd-dial__gear {
  position: absolute;
  left: 50%;
  bottom: 4%;
  min-width: calc(44px * var(--s));
  margin-left: calc(-22px * var(--s));
  padding: calc(4px * var(--s)) calc(8px * var(--s)) calc(2px * var(--s));
  text-align: center;
  font-size: calc(36px * var(--s));
  line-height: 1;
  color: var(--nd-head);
  border: 1px solid var(--nd-hair-strong);
  background: rgb(var(--nd-deep-rgb) / 0.85);
}
.nd-dial__gear.is-r { color: var(--nd-tail); border-color: rgb(var(--nd-tail-rgb) / 0.6); }
.nd-dial__gear.is-n { color: var(--nd-steel); }
.nd-dial__gear.is-shift-a { animation: nd-shift-a .25s var(--ease-out); }
.nd-dial__gear.is-shift-b { animation: nd-shift-b .25s var(--ease-out); }
@keyframes nd-shift-a { from { transform: translateY(-5px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes nd-shift-b { from { transform: translateY(-5px); opacity: .4; } to { transform: none; opacity: 1; } }
.nd-dial__boost {
  position: absolute;
  left: 50%;
  top: 63%;
  width: 34%;
  margin-left: -17%;
  display: grid;
  justify-items: center;
  gap: 3px;
  font-size: max(9px, calc(10px * var(--s)));
  color: var(--nd-steel);
}
.nd-dial__boost i { position: relative; display: block; width: 100%; height: 3px; background: rgb(var(--nd-head-rgb) / 0.14); overflow: hidden; }
.nd-tach__bar { display: none; position: relative; height: 4px; background: rgb(var(--nd-head-rgb) / 0.16); overflow: hidden; --red: 97.5%; }
.nd-tach__bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--red); right: 0; background: rgb(var(--nd-tail-rgb) / 0.85); }
.nd-tach__bar i { position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgb(var(--nd-sodium-rgb) / 0.55), var(--nd-sodium) 70%, var(--nd-hot)); transform-origin: 0 50%; transform: scaleX(0); will-change: transform; }
.nd-tach.is-red .nd-tach__bar i { background: var(--nd-tail); }
.nd-dial__boost i b { position: absolute; inset: 0; background: var(--nd-head); transform-origin: 0 50%; transform: scaleX(0); will-change: transform; }

/* --- controls legend (hints) ----------------------------------------- */
.nd-legend {
  position: absolute;
  left: 50%;
  bottom: calc(var(--edge) + var(--sa-b));
  transform: translateX(-50%);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 18px;
  max-width: calc(100% - 560px * var(--s));
  font-size: 13px;
  color: rgb(var(--nd-head-rgb) / 0.85);
  opacity: 0;
  transition: opacity .6s ease;
}
.nd-legend.is-on { opacity: 1; }
.nd-legend > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-shadow: 0 1px 2px rgb(var(--nd-night-rgb) / 0.9); }
.nd-legend .nd-key { height: 22px; min-width: 22px; font-size: 11px; }

/* --- wall warning ------------------------------------------------------ */
.nd-wall {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: none;            /* out of the render tree while there is nothing to warn about */
  opacity: 0;
  pointer-events: none;
  background:
    linear-gradient(90deg, rgb(var(--nd-tail-rgb) / 0.42) 0, rgb(var(--nd-tail-rgb) / 0) 9%, rgb(var(--nd-tail-rgb) / 0) 91%, rgb(var(--nd-tail-rgb) / 0.42) 100%),
    linear-gradient(0deg, rgb(var(--nd-tail-rgb) / 0.3) 0, rgb(var(--nd-tail-rgb) / 0) 14%);
}

/* --- HUD buttons (pause / camera on touch) --------------------------- */
.nd-hudbtns {
  position: absolute;
  z-index: 4;
  top: calc(var(--edge) * .6 + var(--sa-t));
  right: calc(var(--edge) * .6 + var(--sa-r));
  display: none;
  gap: 8px;
}
.nd-ui.has-touch.hud-on:not(.is-menu):not(.is-paused) .nd-hudbtns { display: flex; pointer-events: auto; }
.nd-hudbtn {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  padding: 0;
  color: var(--nd-head);
  background: rgb(var(--nd-deep-rgb) / 0.6);
  border: 1px solid var(--nd-hair-strong);
  border-radius: 2px;
  cursor: pointer;
  touch-action: manipulation;
}
.nd-hudbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
.nd-hudbtn:active { background: rgb(var(--nd-sodium-rgb) / 0.3); }
.nd-ui.has-touch .nd-score { right: calc(var(--edge) * .6 + var(--sa-r) + 116px); }

/* ==========================================================================
   COUNTDOWN · BANNER · TOASTS
   ========================================================================== */
.nd-count {
  position: absolute;
  z-index: 30;
  left: 0;
  right: 0;
  top: 36%;
  display: grid;
  justify-items: center;
  gap: 14px;
  visibility: hidden;
}
.nd-count.is-on { visibility: visible; }
.nd-count__lamps { display: flex; gap: 14px; }
.nd-count__lamps i {
  width: calc(18px * var(--s));
  height: calc(18px * var(--s));
  border-radius: 50%;
  background: rgb(var(--nd-deep2-rgb) / 0.9);
  box-shadow: inset 0 0 0 2px rgb(var(--nd-head-rgb) / 0.15);
  transition: background-color .12s, box-shadow .12s;
}
.nd-count__lamps i.is-on { background: var(--nd-tail); box-shadow: 0 0 18px 2px rgb(var(--nd-tail-rgb) / 0.8), inset 0 0 0 2px rgb(var(--nd-head-rgb) / 0.3); }
.nd-count.is-go .nd-count__lamps i { background: var(--nd-best); box-shadow: 0 0 18px 2px rgb(var(--nd-best-rgb) / 0.8), inset 0 0 0 2px rgb(var(--nd-head-rgb) / 0.3); }
.nd-count__num {
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 900;
  font-size: calc(200px * var(--s));
  line-height: .8;
  color: var(--nd-head);
  text-transform: uppercase;
  text-shadow: 0 0 40px rgb(var(--nd-night-rgb) / 0.8);
  padding-right: .08em;
}
.nd-count.is-go .nd-count__num { color: var(--nd-sodium); font-size: calc(150px * var(--s)); text-shadow: 0 0 40px rgb(var(--nd-sodium-rgb) / 0.45); }
.nd-count.is-tick .nd-count__num { animation: nd-count-in .9s var(--ease-out) both; }
.nd-count.is-tick.is-go .nd-count__num { animation: nd-go-in 1.1s var(--ease-out) both; }
@keyframes nd-count-in {
  0% { transform: scale(1.5); opacity: 0; }
  18% { transform: scale(1); opacity: 1; }
  75% { opacity: 1; }
  100% { transform: scale(.94); opacity: 0; }
}
@keyframes nd-go-in {
  0% { transform: scale(.7) skewX(-8deg); opacity: 0; letter-spacing: .3em; }
  20% { transform: none; opacity: 1; letter-spacing: .02em; }
  70% { opacity: 1; }
  100% { transform: scale(1.08); opacity: 0; }
}

.nd-banner {
  position: absolute;
  z-index: 25;
  left: 0;
  right: 0;
  top: 25%;
  display: grid;
  justify-items: center;
  padding: calc(16px * var(--s)) 24px calc(18px * var(--s));
  text-align: center;
  visibility: hidden;
  background: linear-gradient(90deg, rgb(var(--nd-night-rgb) / 0) 0, rgb(var(--nd-night-rgb) / 0.66) 28%, rgb(var(--nd-night-rgb) / 0.66) 72%, rgb(var(--nd-night-rgb) / 0) 100%);
}
.nd-banner.is-on { visibility: visible; animation: nd-banner-fade 1s linear both; animation-duration: var(--dur, 2500ms); }
.nd-banner::before, .nd-banner::after {   /* light trails top & bottom */
  content: "";
  position: absolute;
  left: 8%;
  right: 8%;
  height: 2px;
  background: linear-gradient(90deg, rgb(var(--nd-sodium-rgb) / 0) 0, rgb(var(--nd-sodium-rgb) / 0.9) 60%, var(--nd-head) 96%, rgb(var(--nd-head-rgb) / 0) 100%);
  transform-origin: 0 50%;
  transform: scaleX(0);
}
.nd-banner::before { top: 0; }
.nd-banner::after { bottom: 0; background: linear-gradient(270deg, rgb(var(--nd-sodium-rgb) / 0) 0, rgb(var(--nd-sodium-rgb) / 0.9) 60%, var(--nd-head) 96%, rgb(var(--nd-head-rgb) / 0) 100%); transform-origin: 100% 50%; }
.nd-banner.is-on::before, .nd-banner.is-on::after { animation: nd-trail-x .7s var(--ease-out) both; }
.nd-banner__title {
  font-family: var(--nd-font-display);
  font-style: italic;
  font-weight: 900;
  font-size: calc(70px * var(--s));
  line-height: .9;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--nd-head);
  padding-right: .08em;
}
.nd-banner__sub { margin-top: calc(6px * var(--s)); font-size: max(13px, calc(16px * var(--s))); color: rgb(var(--nd-head-rgb) / 0.88); }
.nd-banner.is-on .nd-banner__title { animation: nd-banner-in .55s var(--ease-out) .08s both; }
.nd-banner.is-on .nd-banner__sub { animation: nd-banner-in .55s var(--ease-out) .18s both; }
.nd-banner.is-record .nd-banner__sub { color: var(--nd-best); }
@keyframes nd-trail-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes nd-banner-in { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
@keyframes nd-banner-fade { 0% { opacity: 0; } 6% { opacity: 1; } 86% { opacity: 1; } 100% { opacity: 0; } }

.nd-toasts {
  position: absolute;
  z-index: 40;
  left: 50%;
  bottom: calc(var(--edge) * 2.6 + var(--sa-b));
  transform: translateX(-50%);
  display: grid;
  justify-items: center;
  gap: 6px;
  width: max-content;
  max-width: calc(100vw - 32px);
}
.nd-ui.has-touch .nd-toasts { bottom: calc(118px + var(--sa-b)); }
.nd-toast {
  padding: 9px 16px 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--nd-head);
  background: rgb(var(--nd-deep-rgb) / 0.9);
  border: 1px solid var(--nd-hair-strong);
  border-left: 3px solid var(--nd-sodium);
  border-radius: 2px;
  box-shadow: 0 10px 30px rgb(var(--nd-night-rgb) / 0.5);
  animation: nd-toast-in .25s var(--ease-out) both;
  text-align: center;
}
.nd-toast { max-width: min(560px, calc(100vw - 32px)); line-height: 1.4; text-wrap: balance; }
.nd-toast.is-out { animation: nd-toast-out .3s ease both; }
@keyframes nd-toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes nd-toast-out { to { opacity: 0; transform: translateY(4px); } }

/* ==========================================================================
   TOUCH CONTROLS
   ========================================================================== */
.nd-touch {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: none;
  touch-action: none;
}
.nd-ui.has-touch.hud-on:not(.is-menu):not(.is-paused) .nd-touch { display: block; }
.nd-tc {
  position: absolute;
  pointer-events: auto;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
.nd-steer {
  left: calc(16px + var(--sa-l));
  bottom: calc(16px + var(--sa-b));
  display: flex;
  gap: 10px;
}
.nd-steer__btn {
  position: relative;
  display: grid;
  place-items: center;
  width: 108px;
  height: 108px;
  background: rgb(var(--nd-deep-rgb) / 0.42);
  border: 1px solid rgb(var(--nd-head-rgb) / 0.22);
  border-radius: 2px;
  --p: 0;
}
.nd-steer__btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgb(var(--nd-sodium-rgb) / 0.35);
  opacity: var(--p);
}
.nd-steer__btn::after {             /* LED on the outer edge */
  content: "";
  position: absolute;
  top: 10%;
  bottom: 10%;
  width: 3px;
  background: var(--nd-sodium);
  box-shadow: 0 0 10px rgb(var(--nd-sodium-rgb) / 0.9);
  opacity: var(--p);
}
.nd-steer__btn--l::after { left: -1px; }
.nd-steer__btn--r::after { right: -1px; }
.nd-steer__btn svg { position: relative; width: 38px; height: 38px; fill: none; stroke: var(--nd-head); stroke-width: 2.4; stroke-linecap: square; }

.nd-pedals {
  right: calc(16px + var(--sa-r));
  bottom: calc(16px + var(--sa-b));
  display: grid;
  grid-template-columns: 96px 92px;
  grid-template-rows: auto 64px 92px;
  grid-template-areas:
    "gear gear"
    "hand gas"
    "brake gas";
  gap: 10px;
}
.nd-pedal {
  position: relative;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: rgb(var(--nd-head-rgb) / 0.9);
  background: rgb(var(--nd-deep-rgb) / 0.42);
  border: 1px solid rgb(var(--nd-head-rgb) / 0.22);
  border-radius: 2px;
  transition: background-color .06s;
}
.nd-pedal svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; }
.nd-pedal--gas { grid-area: gas; background-image: repeating-linear-gradient(0deg, rgb(var(--nd-head-rgb) / 0.07) 0 3px, rgb(var(--nd-head-rgb) / 0) 3px 12px); }
.nd-pedal--brake { grid-area: brake; background-image: repeating-linear-gradient(90deg, rgb(var(--nd-head-rgb) / 0.07) 0 3px, rgb(var(--nd-head-rgb) / 0) 3px 12px); }
.nd-pedal--hand { grid-area: hand; }
.nd-pedal.is-down { color: var(--nd-ink); }
.nd-pedal--gas.is-down { background-color: var(--nd-sodium); border-color: var(--nd-sodium); }

.nd-t-hud__vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.nd-t-side { display: grid; justify-items: end; }
.nd-t-side span { font-size: 11.5px; color: var(--nd-steel); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nd-t-side b { font-size: calc(26px * var(--s)); line-height: 1; }
.nd-t-side.is-them b { color: rgb(var(--nd-opp-rgb)); }
.nd-t-hud__tot { margin-top: 4px; font-size: 12px; color: var(--nd-steel); }

.nd-t-prox {
  position: absolute; z-index: 3; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--edge) * 2.6 + var(--sa-b) + 56px);
  display: flex; align-items: baseline; gap: 10px; padding: 6px 16px 7px;
  background: rgb(var(--nd-night-rgb) / 0.62); border: 1px solid var(--nd-hair); border-radius: 2px;
  font-size: 14px; white-space: nowrap;
}
.nd-t-prox[hidden] { display: none; }
.nd-t-prox b { font-size: calc(30px * var(--s)); line-height: 1; color: rgb(var(--nd-opp-rgb)); }
.nd-t-prox b[hidden] { display: none; }
.nd-t-prox span { font-family: var(--nd-font-display); font-style: italic; font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: .04em; }
.nd-t-prox i { font-style: normal; color: var(--nd-steel); }
.nd-t-prox[data-tier=tight] { border-color: rgb(var(--nd-best-rgb) / 0.8); }
.nd-t-prox[data-tier=tight] b, .nd-t-prox[data-tier=tight] span { color: var(--nd-best); }
.nd-t-prox[data-tier=lag] b, .nd-t-prox[data-tier=lag] span { color: var(--nd-sodium); }
.nd-t-prox[data-tier=lost] b, .nd-t-prox[data-tier=lost] span, .nd-t-prox[data-tier=pass] b, .nd-t-prox[data-tier=pass] span { color: rgb(var(--nd-tail-rgb)); }
.nd-t-prox[data-tier=pass] { border-color: rgb(var(--nd-tail-rgb) / 0.8); }
.nd-t-prox[data-tier=lead] span { font-size: 15px; color: var(--nd-steel); }

.nd-t-tag {
  position: absolute; z-index: 2; left: 0; top: 0; padding: 2px 8px 3px;
  font-size: 12.5px; font-weight: 600; color: var(--nd-head); white-space: nowrap;
  background: rgb(var(--nd-night-rgb) / 0.7); border-bottom: 2px solid rgb(var(--nd-opp-rgb)); border-radius: 2px;
  will-change: transform;
}
.nd-t-tag[hidden] { display: none; }

.nd-t-card {
  position: absolute; z-index: 80; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(460px, calc(100vw - 24px)); max-height: calc(100% - 24px); overflow-y: auto;
  padding: 18px 22px 18px; pointer-events: auto;
  background: rgb(var(--nd-deep-rgb) / 0.95); border: 1px solid var(--nd-hair-strong); border-top: 2px solid rgb(var(--nd-opp-rgb));
  border-radius: 2px; box-shadow: 0 30px 80px rgb(var(--nd-night-rgb) / 0.7);
}
.nd-t-card[hidden] { display: none; }
.nd-t-card[data-kind=final] { width: min(560px, calc(100vw - 24px)); }
.nd-t-card h3 { margin: 0 0 8px; font-family: var(--nd-font-display); font-style: italic; font-weight: 900; font-size: 30px; line-height: 1.05; text-transform: uppercase; letter-spacing: .03em; }
.nd-t-card p { margin: 6px 0; color: var(--nd-steel); font-size: 14px; }
.nd-t-card__btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.nd-t-card__btns:empty { display: none; }
.nd-t-verdict[data-v=win] { color: var(--nd-best); }
.nd-t-verdict[data-v=loss] { color: rgb(var(--nd-tail-rgb)); }
.nd-t-duel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0; }
.nd-t-duel div { display: grid; padding: 8px 12px; background: rgb(var(--nd-night-rgb) / 0.5); border-radius: 2px; }
.nd-t-duel span { font-size: 12.5px; color: var(--nd-steel); }
.nd-t-duel b { font-size: 30px; line-height: 1.1; }
.nd-t-duel div + div b { color: rgb(var(--nd-opp-rgb)); }
.nd-t-sum { font-size: 15px !important; color: var(--nd-head) !important; }
.nd-t-sum b { font-size: 20px; }
.nd-t-next { color: var(--nd-sodium) !important; }
.nd-t-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13.5px; }
.nd-t-table th { text-align: left; font-weight: 500; color: var(--nd-steel); padding: 4px 6px; border-bottom: 1px solid var(--nd-hair); }
.nd-t-table td { padding: 5px 6px; border-bottom: 1px solid rgb(var(--nd-steel-rgb) / 0.1); }
.nd-t-table td.nd-num, .nd-t-table th:nth-child(n+3) { text-align: right; }
.nd-t-table td.is-win { color: var(--nd-head); font-weight: 650; }
.nd-t-room { margin: 0 0 12px; padding: 12px; background: rgb(var(--nd-night-rgb) / 0.45); border: 1px solid var(--nd-hair); border-radius: 2px; }
.nd-t-room[hidden], .nd-t-room__off[hidden], .nd-t-room__on[hidden] { display: none; }
.nd-t-room__off { display: grid; gap: 10px; }
.nd-t-room__create { width: 100%; justify-content: center; }
.nd-t-room__join { display: flex; align-items: center; gap: 8px; }
.nd-t-or { flex: none; font-size: 13px; color: var(--nd-steel); }
.nd-t-room input[type=text] {
  height: 40px; padding: 0 10px; font: inherit; font-size: 15px; color: var(--nd-head); letter-spacing: .08em;
  background: rgb(var(--nd-night-rgb) / 0.6); border: 1px solid var(--nd-hair-strong); border-radius: 2px; outline: none;
}
.nd-t-room input[type=text]:focus { border-color: rgb(var(--nd-opp-rgb)); }
.nd-t-room__join input[type=text] { flex: 1; min-width: 0; text-transform: uppercase; }
.nd-t-room__head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; font-size: 13px; color: var(--nd-steel); }
.nd-t-room__head b { font-size: 24px; color: rgb(var(--nd-opp-rgb)); letter-spacing: .1em; }
.nd-t-room__head .nd-btn { margin-left: auto; min-height: 32px; font-size: 13px; }
.nd-t-room__link { display: flex; gap: 8px; }
.nd-t-room__link input[type=text] { flex: 1; min-width: 0; font-size: 13px; letter-spacing: 0; }

</style>

</head>
<body>
<div id="nd-game" aria-hidden="true"></div>
<div id="ui"></div>
<div id="nd-boot" class="nd-boot" role="status" aria-live="polite">
  <div class="nd-boot__inner">
    <div class="nd-boot__kicker">Ночной</div>
    <div class="nd-boot__title">Дрифт</div>
    <div class="nd-boot__track"><div class="nd-boot__bar" id="nd-boot-bar"></div></div>
    <div class="nd-boot__msg" id="nd-boot-msg">Загрузка…</div>
  </div>
</div>
<noscript><p style="position:fixed;inset:auto 16px 16px;color:#ff2d4b;font:15px system-ui,sans-serif">Для игры нужен JavaScript.</p></noscript>
<script>
  document.documentElement.lang = 'ru';
  window.__ndBootTimer = setTimeout(function () {
    var b = document.getElementById('nd-boot');
    if (b && !b.classList.contains('is-done') && !window.__ndStarted) {
      b.classList.add('is-error');
      var m = document.getElementById('nd-boot-msg');
      if (m) m.textContent = 'Не удалось загрузить 3D-движок. Проверьте подключение к интернету и обновите страницу.';
    }
  }, 25000);
</script>
